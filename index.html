<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prototype I</title>

  <style>

    :root {
      /* 숫자가 클수록 천천히 */
      --speed: 75s;
      --item-width: clamp(320px, 42vw, 600px);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      align-items: center;
      background-image: url("Images/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #f2f1ed;
      font-family: Arial, Helvetica, sans-serif;
    }

    .archive {
      width: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
} 

    /* 상단 */
    .header {
      margin-top: 0;
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr;
      align-items: start;
      gap: 36px;
      padding: 28px;
    }

    .title-group {
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(64px, 8vw, 120px);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin-top: 63px;
      font-size: 14px;
      line-height: 1.4;
    }

    .description {
      margin: 0;
      max-width: 35ch;
      color: #bdbdb7;
      font-family: "Courier New", monospace;
      font-size: 14px;
      line-height: 1.6;
    }

    /* 이미지 캐러셀 */
    .carousel {
      overflow: hidden;
      margin-top: 36px;
    }

    .track {
      display: flex;
      width: max-content;
      animation: move-right var(--speed) linear infinite;
      will-change: transform;
    }

    .group {
      display: flex;
      flex-shrink: 0;
    }

    .item {
      flex: 0 0 var(--item-width);
      width: var(--item-width);
      margin: 0;
      padding: 0 clamp(24px, 4vw, 64px);
    }

    .image-area {
      position: relative;
      display: grid;
      place-items: center;
      height: clamp(320px, 38vw, 530px);
      cursor: pointer;
      color: inherit;
      text-decoration: none;
    }

    .image-area img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 이미지가 없을 때 표시 */
    .placeholder {
      display: grid;
      place-items: center;
      width: 100%;
      height: 75%;
      border: 1px dashed #41413e;
      color: #898982;
      font-family: "Courier New", monospace;
      font-size: 16px;
      letter-spacing: 0.12em;
    }

    .image-area.loaded .placeholder {
      display: none;
    }

    figcaption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 30px 0 40px;
      color: #c5c5bd;
      font-family: "Courier New", monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .image-name::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 10px;
      border-radius: 50%;
      background: #efefe9;
    }

    /* 동일한 그룹 두 개를 이어서 오른쪽으로 이동 */
    @keyframes move-right {
      from {
        transform: translateX(-50%);
      }

      to {
        transform: translateX(0);
      }
    }

    .archive.paused .track {
      animation-play-state: paused;
    }

    /* 하단 */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 16px 28px;
      border-top: 1px solid #292929;
      color: #aaa;
      font-family: "Courier New", monospace;
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 0.06em;
    }

    .pause-button {
      padding: 9px 14px;
      border: 1px solid #555;
      background: transparent;
      color: #eee;
      font: 14px Arial, sans-serif;
      cursor: pointer;
    }

    .pause-button:hover {
      background: #292929;
    }

    .pause-button:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    /* =========================
       HOVER CARD
    ========================= */

    .hover-card {
  position: fixed;
  top: 0;
  left: 0;

  width: clamp(260px, 22vw, 360px);

  height: auto;
  overflow: visible;

  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  z-index: 9999;

  transform: translateY(-50%);
  transition: opacity 0.15s ease;
}

.hover-card.visible {
  opacity: 1;
  visibility: visible;
}

.hover-card img {
  display: block;

  width: 100%;
  height: auto;

  object-fit: contain;
}

    @media (max-width: 760px) {
      :root {
        --item-width: 82vw;
      }

      .archive {
        width: calc(100% - 28px);
        margin: 24px auto;
      }

      .header {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 24px 20px;
      }

      h1 {
        font-size: 76px;
      }

      .description {
        max-width: none;
      }

      .carousel {
        margin-top: 12px;
      }

      .item {
        padding: 0 24px;
      }

      .image-area {
        height: 330px;
      }

      .footer {
        padding: 14px 20px;
      }

      .hover-card {
        display: none;
      }
    }

    /* 움직임 줄이기 설정 사용 시 수동 가로 스크롤 */
    @media (prefers-reduced-motion: reduce) {
      .track {
        animation: none;
        transform: none;
        will-change: auto;
      }

      .carousel {
        overflow-x: auto;
      }

      .group[aria-hidden="true"] {
        display: none;
      }
    }
/* MENU ADDITION START */
.site-nav {
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:10px 20px;
  font:11px/1.5 Arial,sans-serif;
  letter-spacing:.025em;
}

.site-nav a {
  color:inherit;
  text-decoration:none;
  opacity:.7;
}

.site-nav a:hover,.site-nav a[aria-current="page"] {
  opacity:1;
  text-decoration:underline;
  text-underline-offset:5px;
}

.site-nav a:focus-visible {
  outline:1px solid currentColor;
  outline-offset:5px;
}

.archive > .site-nav {
  position:absolute;
  top:18px;
  right:28px;
  left:55%;
  z-index:20;
}

.archive {
  position:relative;
}

@media(max-width:1000px) {
  .archive > .site-nav {
    position:relative;
    top:auto;
    right:auto;
    left:auto;
    padding:12px 20px 0;
  }
}

/* MENU ADDITION END */


  </style>
</head>

<body>

  <main class="archive" id="archive">
<!-- MENU ADDITION START -->
<nav class="site-nav" aria-label="Main navigation">
  <a href="index.html" aria-current="page">Exhibition</a>
  <a href="forest.html">Symbol Detail</a>
  <a href="symbols.html">Symbol Index</a>
  <a href="culture.html">The Culture</a>
  <a href="about.html">About & Process</a>
</nav>
<!-- MENU ADDITION END -->

    <header class="header">
      <div class="title-group">
        <h1>LithoScript</h1>

        <span class="subtitle">
          Words<br />
          on Stone
        </span>
      </div>
    </header>

    <section class="carousel" aria-label="기록물 이미지">

      <div class="track" id="track">

        <div class="group" id="image-group">

          <!-- IMAGE 1 -->
          <figure class="item" data-card="Images/tag card 1.png">

            <a class="image-area" href="forest.html">
                <div class="placeholder">IMAGE 1</div>

                  <img src="Images/rock 1-1.png" alt="Image 1" hidden/>
            </a>

            <figcaption>
              <span class="image-name">FOREST</span>
              <span>Fragment 001</span>
            </figcaption>

          </figure>


          <!-- IMAGE 2 -->
          <figure class="item" data-card="Images/tag card 2.png">

            <a class="image-area" href="harvest.html">
                <div class="placeholder">IMAGE 1</div>

                  <img src="Images/rock 2-1.png" alt="Image 2" hidden/>
            </a>


            <figcaption>
              <span class="image-name">HARVEST</span>
              <span>Fragment 002</span>
            </figcaption>

          </figure>


          <!-- IMAGE 3 -->
          <figure class="item" data-card="Images/tag card 3.png">

            <a class="image-area" href="hunting.html">
                <div class="placeholder">IMAGE 1</div>

                  <img src="Images/rock 3-1.png" alt="Image 3" hidden/>
            </a>

            <figcaption>
              <span class="image-name">HUNTING</span>
              <span>Fragment 003</span>
            </figcaption>

          </figure>

        </div>
      </div>

    </section>


    <footer class="footer">

      <span>
        Thesis / PROTOTYPE 01
      </span>

      <button
        class="pause-button"
        id="pause-button"
        type="button"
        aria-pressed="false"
      >
        Ella Lee
      </button>

    </footer>

  </main>


  <!-- HOVER CARD -->
  <div class="hover-card" id="hover-card">

    <img
      id="hover-card-image"
      src="Images/tag card 1.png"
      alt="Artifact information card"
    />

  </div>


  <script>

    const archive =
      document.getElementById("archive");

    const track =
      document.getElementById("track");

    const group =
      document.getElementById("image-group");

    const pauseButton =
      document.getElementById("pause-button");


    /* =========================
       캐러셀 복제
    ========================= */

    const duplicate =
      group.cloneNode(true);

    duplicate.removeAttribute("id");

    duplicate.setAttribute(
      "aria-hidden",
      "true"
    );
duplicate.querySelectorAll("a").forEach((link) => {
  link.tabIndex = -1;
});
    track.appendChild(duplicate);


    /* =========================
       이미지 로딩
    ========================= */

    document
      .querySelectorAll(".image-area img")
      .forEach((img) => {

        function showImage() {

          if (img.naturalWidth > 0) {

            img.hidden = false;

            img.parentElement
              .classList
              .add("loaded");
          }

        }

        img.addEventListener(
          "load",
          showImage
        );

        img.addEventListener(
          "error",
          () => {

            img.hidden = true;

            img.parentElement
              .classList
              .remove("loaded");

          }
        );

        if (img.complete) {
          showImage();
        }

      });


    /* =========================
       재생 / 일시정지
    ========================= */

    pauseButton.addEventListener(
      "click",
      () => {

        const paused =
          archive.classList.toggle("paused");

        pauseButton.setAttribute(
          "aria-pressed",
          String(paused)
        );

      }
    );


    /* =========================
       Reduced Motion
    ========================= */

    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );

    function updateMotionControl() {

      pauseButton.hidden =
        reducedMotion.matches;

    }

    reducedMotion.addEventListener(
      "change",
      updateMotionControl
    );

    updateMotionControl();


    /* =========================
       HOVER CARD
    ========================= */

    const hoverCard =
      document.getElementById(
        "hover-card"
      );

    const hoverCardImage =
      document.getElementById(
        "hover-card-image"
      );

    /*
      그룹을 복제한 뒤 선택해야
      복제된 돌에도 hover가 적용됨
    */
    const hoverItems =
      document.querySelectorAll(".item");

    const CARD_GAP = 30;
    const EDGE_GAP = 20;


    hoverItems.forEach((item) => {

      const imageArea =
        item.querySelector(
          ".image-area"
        );


      /* 마우스 들어오면 카드 표시 */
      imageArea.addEventListener(
        "mouseenter",
        () => {

          const cardImage =
            item.dataset.card;

          if (cardImage) {

            hoverCardImage.src =
              cardImage;

          }

          hoverCard.classList.add(
            "visible"
          );

        }
      );


      /* 마우스를 따라 카드 이동 */
      imageArea.addEventListener(
        "mousemove",
        (event) => {

          const mouseX =
            event.clientX;

          const mouseY =
            event.clientY;

          const screenCenter =
            window.innerWidth / 2;

          const cardWidth =
            hoverCard.offsetWidth;

          const cardHeight =
            hoverCard.offsetHeight;

          let cardX;
          let cardY;


          /*
            화면 왼쪽에 커서가 있으면
            카드가 오른쪽에 뜸
          */
          if (
            mouseX < screenCenter
          ) {

            cardX =
              mouseX + CARD_GAP;

          }

          /*
            화면 오른쪽에 커서가 있으면
            카드가 왼쪽에 뜸
          */
          else {

            cardX =
              mouseX
              - cardWidth
              - CARD_GAP;

          }


          /*
            세로 위치는
            커서 중앙 기준
          */
          cardY =
            mouseY;


          /*
            화면 위/아래로
            카드가 잘리지 않게 제한
          */
          const halfHeight =
            cardHeight / 2;

          cardY =
            Math.max(
              halfHeight + EDGE_GAP,
              Math.min(
                window.innerHeight
                  - halfHeight
                  - EDGE_GAP,
                cardY
              )
            );


          hoverCard.style.left =
            `${cardX}px`;

          hoverCard.style.top =
            `${cardY}px`;

        }
      );


      /* 마우스 빠져나가면 카드 숨김 */
      imageArea.addEventListener(
        "mouseleave",
        () => {

          hoverCard.classList.remove(
            "visible"
          );

        }
      );

    });

  </script>

</body>
</html>
