<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prototype I</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      /* 숫자가 클수록 천천히 */
      --speed: 75s;
      --item-width: clamp(320px, 42vw, 600px);
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* 전체 페이지 스크롤 방지 */
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url("Images/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #f2f1ed;
      font-family: Arial, Helvetica, sans-serif;
    }

    .archive {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: transparent;
      overflow: hidden;
    } 

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr;
      align-items: start;
      gap: 36px;
      padding: 28px;
      z-index: 100;
      background: transparent;
    }

    .title-group {
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(64px, 8vw, 120px);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin-top: 63px;
      font-size: 14px;
      line-height: 1.4;
    }

    .description {
      margin: 0;
      max-width: 35ch;
      color: #bdbdb7;
      font-family: "Courier New", monospace;
      font-size: 14px;
      line-height: 1.6;
    }

    /* 이미지 캐러셀: 화면 정중앙 배치 */
    .carousel {
      width: 100%;
      overflow: hidden;
      margin: auto 0;
    }

    .track {
      display: flex;
      width: max-content;
      animation: move-right var(--speed) linear infinite;
      will-change: transform;
    }

    .group {
      display: flex;
      flex-shrink: 0;
    }

    .item {
      flex: 0 0 var(--item-width);
      width: var(--item-width);
      margin: 0;
      padding: 0 clamp(24px, 4vw, 64px);
    }

    .image-area {
      position: relative;
      display: grid;
      place-items: center;
      height: clamp(280px, 35vw, 480px);
      cursor: pointer;
      color: inherit;
      text-decoration: none;
    }

    .image-area img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 이미지가 없을 때 표시 */
    .placeholder {
      display: grid;
      place-items: center;
      width: 100%;
      height: 75%;
      border: 1px dashed #41413e;
      color: #898982;
      font-family: "Courier New", monospace;
      font-size: 16px;
      letter-spacing: 0.12em;
    }

    .image-area.loaded .placeholder {
      display: none;
    }

    figcaption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 0 0;
      color: #c5c5bd;
      font-family: "Courier New", monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .image-name::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 10px;
      border-radius: 50%;
      background: #efefe9;
    }

    /* 동일한 그룹 두 개를 이어서 오른쪽으로 이동 */
    @keyframes move-right {
      from {
        transform: translateX(-50%);
      }
      to {
        transform: translateX(0);
      }
    }

    .archive.paused .track {
      animation-play-state: paused;
    }

    /* 하단 푸터: 화면 맨 아래 고정 (블러 및 배경 제거) */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 16px 28px;
      border-top: 1px solid #292929;
      background: transparent;
      color: #aaa;
      font-family: "Courier New", monospace;
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 0.06em;
      z-index: 100;
    }

    .pause-button {
      padding: 9px 14px;
      border: 1px solid #555;
      background: transparent;
      color: #eee;
      font: 14px Arial, sans-serif;
      cursor: pointer;
    }

    .pause-button:hover {
      background: #292929;
    }

    .pause-button:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    /* =========================
        HOVER CARD
    ========================= */
    .hover-card {
      position: fixed;
      top: 0;
      left: 0;
      width: clamp(260px, 22vw, 360px);
      height: auto;
      overflow: visible;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      z-index: 9999;
      transform: translateY(-50%);
      transition: opacity 0.15s ease;
    }

    .hover-card.visible {
      opacity: 1;
      visibility: visible;
    }

    .hover-card img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    @media (max-width: 760px) {
      :root {
        --item-width: 82vw;
      }

      .header {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 24px 20px;
      }

      h1 {
        font-size: 76px;
      }

      .description {
        max-width: none;
      }

      .image-area {
        height: 280px;
      }

      .footer {
        padding: 14px 20px;
      }

      .hover-card {
        display: none;
      }
    }

    /* 움직임 줄이기 설정 사용 시 */
    @media (prefers-reduced-motion: reduce) {
      .track {
        animation: none;
        transform: none;
        will-change: auto;
      }

      .carousel {
        overflow-x: auto;
      }

      .group[aria-hidden="true"] {
        display: none;
      }
    }

    /* MENU ADDITION START */
    .site-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px 20px;
      font: 11px/1.5 Arial, sans-serif;
      letter-spacing: .025em;
    }

    .site-nav a {
      color: inherit;
      text-decoration: none;
      opacity: .7;
    }

    .site-nav a:hover, .site-nav a[aria-current="page"] {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    .site-nav a:focus-visible {
      outline: 1px solid currentColor;
      outline-offset: 5px;
    }

    .header .site-nav {
      grid-column: 2 / 4;
      justify-self: end;
      align-self: start;
    }

    @media(max-width: 1000px) {
      .header .site-nav {
        grid-column: 1 / -1;
        justify-self: start;
      }
    }
    /* MENU ADDITION END */
  </style>
</head>

<body>

  <main class="archive" id="archive">

    <header class="header">
      <div class="title-group">
        <h1>LithoScript</h1>
        <span class="subtitle">
          Words<br />
          on Stone
        </span>
      </div>

      <!-- MENU ADDITION -->
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html" aria-current="page">Exhibition</a>
        <a href="forest.html">Symbol Detail</a>
        <a href="symbols.html">Symbol Index</a>
        <a href="culture.html">The Culture</a>
        <a href="about.html">About & Process</a>
      </nav>
    </header>

    <section class="carousel" aria-label="기록물 이미지">
      <div class="track" id="track">
        <div class="group" id="image-group">
          <!-- IMAGE 1 -->
          <figure class="item" data-card="Images/tag card 1.png">
            <a class="image-area" href="forest.html">
                <div class="placeholder">IMAGE 1</div>
                  <img src="Images/rock 1-1.png" alt="Image 1" hidden/>
            </a>
            <figcaption>
              <span class="image-name">FOREST</span>
              <span>Fragment 001</span>
            </figcaption>
          </figure>

          <!-- IMAGE 2 -->
          <figure class="item" data-card="Images/tag card 2.png">
            <a class="image-area" href="harvest.html">
                <div class="placeholder">IMAGE 2</div>
                  <img src="Images/rock 2-1.png" alt="Image 2" hidden/>
            </a>
            <figcaption>
              <span class="image-name">HARVEST</span>
              <span>Fragment 002</span>
            </figcaption>
          </figure>

          <!-- IMAGE 3 -->
          <figure class="item" data-card="Images/tag card 3.png">
            <a class="image-area" href="hunting.html">
                <div class="placeholder">IMAGE 3</div>
                  <img src="Images/rock 3-1.png" alt="Image 3" hidden/>
            </a>
            <figcaption>
              <span class="image-name">HUNTING</span>
              <span>Fragment 003</span>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>

              <!-- IMAGE 4 -->
          <figure class="item" data-card="Images/tag card 4.png">
            <a class="image-area" href="path.html">
                <div class="placeholder">IMAGE 4</div>
                  <img src="Images/rock 4-1.png" alt="Image 4" hidden/>
            </a>
            <figcaption>
              <span class="image-name">PATH</span>
              <span>Fragment 004</span>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>

              <!-- IMAGE 5 -->
          <figure class="item" data-card="Images/tag card 5.png">
            <a class="image-area" href="river.html">
                <div class="placeholder">IMAGE 5</div>
                  <img src="Images/rock 5-1.png" alt="Image 5" hidden/>
            </a>
            <figcaption>
              <span class="image-name">RIVER</span>
              <span>Fragment 005</span>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>

              <!-- IMAGE 6 -->
          <figure class="item" data-card="Images/tag card 6.png">
            <a class="image-area" href="sun.html">
                <div class="placeholder">IMAGE 6</div>
                  <img src="Images/rock 6-1.png" alt="Image 6" hidden/>
            </a>
            <figcaption>
              <span class="image-name">SUN</span>
              <span>Fragment 006</span>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>
        Thesis / PROTOTYPE 01
      </span>
      <button
        class="pause-button"
        id="pause-button"
        type="button"
        aria-pressed="false"
      >
        Ella Lee
      </button>
    </footer>

  </main>

  <!-- HOVER CARD -->
  <div class="hover-card" id="hover-card">
    <img
      id="hover-card-image"
      src="Images/tag card 1.png"
      alt="Artifact information card"
    />
  </div>

  <script>
    const archive = document.getElementById("archive");
    const track = document.getElementById("track");
    const group = document.getElementById("image-group");
    const pauseButton = document.getElementById("pause-button");

    /* =========================
       캐러셀 복제
    ========================= */
    const duplicate = group.cloneNode(true);
    duplicate.removeAttribute("id");
    duplicate.setAttribute("aria-hidden", "true");
    duplicate.querySelectorAll("a").forEach((link) => {
      link.tabIndex = -1;
    });
    track.appendChild(duplicate);

    /* =========================
       이미지 로딩
    ========================= */
    document.querySelectorAll(".image-area img").forEach((img) => {
      function showImage() {
        if (img.naturalWidth > 0) {
          img.hidden = false;
          img.parentElement.classList.add("loaded");
        }
      }
      img.addEventListener("load", showImage);
      img.addEventListener("error", () => {
        img.hidden = true;
        img.parentElement.classList.remove("loaded");
      });
      if (img.complete) {
        showImage();
      }
    });

    /* =========================
       재생 / 일시정지
    ========================= */
    pauseButton.addEventListener("click", () => {
      const paused = archive.classList.toggle("paused");
      pauseButton.setAttribute("aria-pressed", String(paused));
    });

    /* =========================
       Reduced Motion
    ========================= */
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    function updateMotionControl() {
      pauseButton.hidden = reducedMotion.matches;
    }
    reducedMotion.addEventListener("change", updateMotionControl);
    updateMotionControl();

    /* =========================
       HOVER CARD
    ========================= */
    const hoverCard = document.getElementById("hover-card");
    const hoverCardImage = document.getElementById("hover-card-image");
    const hoverItems = document.querySelectorAll(".item");

    const CARD_GAP = 30;
    const EDGE_GAP = 20;

    hoverItems.forEach((item) => {
      const imageArea = item.querySelector(".image-area");

      imageArea.addEventListener("mouseenter", () => {
        const cardImage = item.dataset.card;
        if (cardImage) {
          hoverCardImage.src = cardImage;
        }
        hoverCard.classList.add("visible");
      });

      imageArea.addEventListener("mousemove", (event) => {
        const mouseX = event.clientX;
        const mouseY = event.clientY;
        const screenCenter = window.innerWidth / 2;
        const cardWidth = hoverCard.offsetWidth;
        const cardHeight = hoverCard.offsetHeight;

        let cardX;
        let cardY;

        if (mouseX < screenCenter) {
          cardX = mouseX + CARD_GAP;
        } else {
          cardX = mouseX - cardWidth - CARD_GAP;
        }

        cardY = mouseY;

        const halfHeight = cardHeight / 2;
        cardY = Math.max(
          halfHeight + EDGE_GAP,
          Math.min(window.innerHeight - halfHeight - EDGE_GAP, cardY)
        );

        hoverCard.style.left = `${cardX}px`;
        hoverCard.style.top = `${cardY}px`;
      });

      imageArea.addEventListener("mouseleave", () => {
        hoverCard.classList.remove("visible");
      });
    });
  </script>
</body>
</html>
